name: Run python tests with pytest
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  pytest_and_coverage:
    name: Run tests and count coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # tests/requirements.txt is exported from uv.lock with hashes: the core
      # runtime, the docling extra and the test tools.
      - name: Install dependencies
        run: pip install --require-hashes -r tests/requirements.txt
      - name: Check the REST API reference snapshot is current
        run: python -m docsgpt.api.reference --check
      - name: Test with pytest and generate coverage report
        run: |
          python -m pytest -n auto --cov=docsgpt --cov-report=xml --cov-report=term-missing --durations=25
      - name: Upload coverage reports to Codecov
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
