name: Sign release assets

# Signs the files already attached to existing releases with a keyless cosign
# signature and attaches it next to each file as <file>.sigstore.json.
# Releases made by backend-release.yml get SLSA provenance when they are
# built; this covers the releases published before that. A signature only says
# these exact bytes are the files the project published, not how they were
# built, so provenance is never backfilled here.
# Run it from main after merge, e.g.:
#   gh workflow run sign-release-assets.yml --ref main -f tags="1.1.0 1.0.0"

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Release tags to sign, separated by spaces or commas (e.g. "1.1.0 1.0.0")'
        required: true
        type: string

permissions: {}

concurrency:
  group: sign-release-assets
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'arc53/DocsGPT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload the signatures to the releases
      id-token: write # cosign signs keylessly with the workflow's OIDC identity
    env:
      GH_REPO: ${{ github.repository }}
      # The signing identity: this workflow on main. The verify step and the
      # SECURITY.md instructions check the signature against it.
      CERT_IDENTITY: https://github.com/arc53/DocsGPT/.github/workflows/sign-release-assets.yml@refs/heads/main
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (got $GITHUB_REF): the signatures name the workflow on main."
            exit 1
          fi

      - name: Validate the tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          read -r -a requested <<< "$(printf '%s' "$TAGS" | tr ',\n\t' '   ')"
          if [ "${#requested[@]}" -eq 0 ]; then
            echo "::error::No tags given."
            exit 1
          fi
          valid=" "
          for tag in "${requested[@]}"; do
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Not a release tag: '$tag' (expected X.Y.Z)."
              exit 1
            fi
            if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
              echo "::error::No release for tag $tag."
              exit 1
            fi
            case "$valid" in
              *" $tag "*) ;;
              *) valid="$valid$tag " ;;
            esac
          done
          valid="${valid# }"
          echo "tags=${valid% }" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign, verify and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "$RELEASE_TAGS"
          {
            echo "## Release asset signatures"
            echo
            echo "| Release | Asset | Result |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          row() { echo "| $1 | \`$2\` | $3 |" >> "$GITHUB_STEP_SUMMARY"; }
          has_asset() {
            local a
            for a in "${assets[@]}"; do
              [ "$a" = "$1" ] && return 0
            done
            return 1
          }

          for tag in "${tags[@]}"; do
            names=$(gh release view "$tag" --json assets --jq '.assets[].name')
            assets=()
            while IFS= read -r a; do
              [ -n "$a" ] && assets+=("$a")
            done <<< "$names"
            if [ "${#assets[@]}" -eq 0 ]; then
              echo "::notice::$tag has no assets."
              row "$tag" "-" "no assets"
              continue
            fi
            dir=$(mktemp -d "$RUNNER_TEMP/sign.XXXXXX")
            for name in "${assets[@]}"; do
              case "$name" in
                *.sigstore.json | *.sigstore | *.sig | *.sign | *.asc | *.minisig | *.intoto.jsonl | *.pem | *.crt | *.cert)
                  # A signature, certificate or provenance file, not a release file.
                  continue ;;
              esac
              if ! [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
                echo "::warning::$tag: skipping asset with an unexpected name: $name"
                row "$tag" "-" "skipped: an asset with an unexpected name (see the log)"
                continue
              fi
              if has_asset "$name.sigstore.json"; then
                echo "$tag/$name already has $name.sigstore.json; leaving it."
                row "$tag" "$name" "skipped: already signed"
                continue
              fi

              gh release download "$tag" --dir "$dir" --pattern "$name"
              file="$dir/$name"
              bundle="$file.sigstore.json"
              cosign sign-blob --yes --bundle "$bundle" "$file" >/dev/null
              cosign verify-blob \
                --bundle "$bundle" \
                --certificate-identity "$CERT_IDENTITY" \
                --certificate-oidc-issuer "$CERT_ISSUER" \
                "$file"
              # No --clobber: an existing signature is never replaced, and a
              # concurrent upload of the same name fails instead.
              gh release upload "$tag" "$bundle"
              sha=$(sha256sum "$file" | cut -d' ' -f1)
              echo "Signed $tag/$name (sha256 $sha)."
              row "$tag" "$name" "signed, sha256 \`$sha\`"
            done
          done
