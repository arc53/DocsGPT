name: Docs site

# Builds the documentation site on every change to docs/, checks that every
# page has a valid lastUpdated date, and checks every internal link and #anchor
# in the built pages, offline. A pull request must also leave alone the files
# and dates that the "Generated docs" workflow owns (generated-docs.yml). A
# weekly job checks the external links in the docs and the top-level Markdown
# files; it reports and never fails.

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check internal links
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a pull request HEAD is the merge commit; its first parent is the
          # base branch, which the date and generated-file checks compare against.
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test the docs scripts
        run: npm test

      # The generated files change only in the "Generated docs" workflow's own
      # pull request, which comes from the generated-docs branch of this repository.
      - name: Check no generated file was changed
        if: github.event_name == 'pull_request' && !(github.head_ref == 'generated-docs' && github.event.pull_request.head.repo.full_name == github.repository)
        run: npm run generated:check -- --base HEAD^1

      # Fails on a missing, malformed or future lastUpdated date. On a pull
      # request it also fails when an existing page's date was changed: pages
      # are dated on main after the merge.
      - name: Check lastUpdated dates
        env:
          BASE: ${{ github.event_name == 'pull_request' && !(github.head_ref == 'generated-docs' && github.event.pull_request.head.repo.full_name == github.repository) && '--base HEAD^1' || '' }}
        # shellcheck disable=SC2086 # BASE is empty or two words
        run: npm run dates:check -- $BASE

      - name: Build the site
        run: npm run build

      - name: Check internal links and anchors
        run: node scripts/check-links.mjs

  external-links:
    name: Check external links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only http(s) links are checked: --root-dir turns the docs' root-relative
      # links into local paths, which --scheme then leaves out (the build job
      # covers those). Code blocks are skipped, so example URLs are not fetched.
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          args: >-
            --no-progress
            --scheme https --scheme http
            --root-dir ${{ github.workspace }}/docs/content
            --exclude-loopback
            --exclude '^https?://([a-z0-9-]+\.)*example\.(com|org)'
            --exclude 'your-'
            --accept '100..=103,200..=299,403,429'
            --max-retries 3
            'README.md' 'HACKTOBERFEST.md' 'CONTRIBUTING.md' 'docs/README.md'
            'docs/content/**/*.mdx'
