# Relays issue and pull request events to the DocsGPT triage agent.
# Off until the TRIAGE_MODE repository variable is set (shadow or live);
# see .github/triage/README.md.
name: Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  # zizmor: ignore[dangerous-triggers] needs secrets for fork PRs; never checks out or runs PR code
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  status:
  # zizmor: ignore[dangerous-triggers] reads the finished run's facts only; never checks out PR code
  workflow_run:
    workflows:
      - Run python tests with pytest
      - Python linting
      - Docs site
      - Build the Python package
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: What to triage
        type: choice
        options: [issue, pr]
        required: true
      number:
        description: Issue or pull request number
        type: number
        required: true

permissions: {}

env:
  CLI_VERSION: v1.6.1

concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number || github.event.sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  relay:
    if: >-
      github.repository == 'arc53/DocsGPT' && vars.TRIAGE_MODE != '' &&
      (github.event_name == 'status' || github.event_name == 'workflow_run' || github.event.sender.type != 'Bot') &&
      (github.event_name != 'status' || (github.event.context == 'CodeRabbit' && github.event.state == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      # The default branch's copy of the relay, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/triage

      - name: Collect the facts
        id: facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIAGE_MODE: ${{ vars.TRIAGE_MODE }}
          TRIAGE_BOT_LOGIN: ${{ vars.TRIAGE_BOT_LOGIN }}
          TRIAGE_MAINTAINERS: ${{ vars.TRIAGE_MAINTAINERS }}
        run: |
          python3 .github/triage/relay.py --out "$RUNNER_TEMP/triage"
          if [ -s "$RUNNER_TEMP/triage/jobs.tsv" ]; then echo "send=true" >> "$GITHUB_OUTPUT"; fi

      # The agent's answer stays out of this public log; a failed run fails the job.
      - name: Send them to the triage agent
        if: steps.facts.outputs.send == 'true'
        env:
          DOCSGPT_WEBHOOK_URL: ${{ secrets.TRIAGE_WEBHOOK_URL }}
          DOCSGPT_NO_UPDATE_CHECK: "1"
        run: |
          cli_dir="$RUNNER_TEMP/docsgpt-cli"
          mkdir -p "$cli_dir"
          base="https://github.com/arc53/DocsGPT-cli/releases/download/${CLI_VERSION}"
          (cd "$cli_dir" && curl -fsSLO "$base/docsgpt-cli_linux_amd64.tar.gz" && curl -fsSLO "$base/checksums.txt" \
            && grep ' docsgpt-cli_linux_amd64.tar.gz$' checksums.txt | sha256sum -c - \
            && tar -xzf docsgpt-cli_linux_amd64.tar.gz docsgpt-cli)
          failed=0
          while IFS=$'\t' read -r key file; do
            echo "Triggering $(basename "$file")"
            "$cli_dir/docsgpt-cli" agents trigger -f "$file" --idempotency-key "$key" --wait --timeout 8m \
              < /dev/null > /dev/null || failed=1
          done < "$RUNNER_TEMP/triage/jobs.tsv"
          exit "$failed"
