name: Build and push DocsGPT Docker image

# Runs for a release created by hand (the release event), or called by the
# backend-release workflow with the version it just tagged: GitHub never starts
# workflows from events GITHUB_TOKEN produces, so a bot-created release does not
# fire the release trigger on its own.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: Release tag to build and push (the images are tagged with it)
        type: string
        required: true
      move_latest:
        description: Also move the `latest` tag onto this build
        type: boolean
        default: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build and push (the images are tagged with it)
        type: string
        required: true
      move_latest:
        description: Also move the `latest` tag onto this build
        type: boolean
        default: true

permissions:
  contents: read

env:
  # The tag being published: passed in by the caller, or the release's own.
  RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}

jobs:
  build:
    if: github.repository == 'arc53/DocsGPT'
    # Publishing jobs run in a GitHub Actions environment so the registry
    # credentials can be scoped to it and protection rules (required reviewers,
    # branch restrictions) applied in the repository settings.
    environment: docker-hub
    env:
      # Public namespace the compose files pull from; the login secret only
      # authenticates the push.
      DOCKERHUB_NAMESPACE: arc53
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        # "" is the slim default image; "-docling" bakes the docling parser
        # engine, its models and tesseract in (OCR-ready).
        variant: ["", "-docling"]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the source the tag names, not whatever the run was started
          # from: a manual run dispatched off main would otherwise publish the
          # current branch under an older version's tags. Resolved under
          # refs/tags/ so a version that is also a branch name cannot win, and a
          # version with no tag fails here instead of mislabelling an image.
          # Falls back to the run's own ref for the push that tags `develop`.
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/docsgpt
            ghcr.io/${{ github.repository_owner }}/docsgpt
          labels: |
            org.opencontainers.image.title=DocsGPT${{ matrix.variant }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Build and push platform-specific images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: './docsgpt/Dockerfile'
          platforms: ${{ matrix.platform }}
          context: .
          push: true
          build-args: |
            EXTRAS=${{ matrix.variant == '-docling' && 'docling' || '' }}
            INSTALL_TESSERACT=${{ matrix.variant == '-docling' && 'true' || 'false' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/docsgpt:${{ env.RELEASE_TAG }}${{ matrix.variant }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
            ghcr.io/${{ github.repository_owner }}/docsgpt:${{ env.RELEASE_TAG }}${{ matrix.variant }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/docsgpt:latest${{ matrix.variant }}
          cache-to: type=inline

  manifest:
    if: github.repository == 'arc53/DocsGPT'
    # Publishing jobs run in a GitHub Actions environment so the registry
    # credentials can be scoped to it and protection rules (required reviewers,
    # branch restrictions) applied in the repository settings.
    environment: docker-hub
    env:
      # Public namespace the compose files pull from; the login secret only
      # authenticates the push.
      DOCKERHUB_NAMESPACE: arc53
    needs: build
    strategy:
      matrix:
        variant: ["", "-docling"]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          TAG: ${{ env.RELEASE_TAG }}${{ matrix.variant }}
          VARIANT: ${{ matrix.variant }}
          # Raw facts; the shell below decides from them what `latest` does.
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
          MOVE_LATEST: ${{ inputs.move_latest }}
        run: |
          set -e
          # `latest` follows this build, except for a release marked prerelease
          # (the release trigger fires for those too) or a manual run that asked
          # it not to. MOVE_LATEST is empty for a release event, where only the
          # prerelease flag decides.
          moving="latest${VARIANT}"
          if [ "$IS_PRERELEASE" = true ] || [ "$MOVE_LATEST" = false ]; then
            moving=""
          fi
          # $moving is deliberately unquoted: an empty word would create a
          # manifest named "$repo:".
          for repo in "$DOCKERHUB_NAMESPACE/docsgpt" "ghcr.io/${{ github.repository_owner }}/docsgpt"; do
            for name in "$TAG" $moving; do
              docker manifest create "$repo:$name" \
                --amend "$repo:$TAG-amd64" \
                --amend "$repo:$TAG-arm64"
              docker manifest push "$repo:$name"
            done
          done

  release-assets:
    if: github.repository == 'arc53/DocsGPT'
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      attest: ${{ steps.hashes.outputs.attest }}
      tag: ${{ steps.hashes.outputs.tag }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the source the tag names, not whatever the run was started
          # from: a manual run dispatched off main would otherwise publish the
          # current branch under an older version's tags. Resolved under
          # refs/tags/ so a version that is also a branch name cannot win, and a
          # version with no tag fails here instead of mislabelling an image.
          # Falls back to the run's own ref for the push that tags `develop`.
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false

      # The installers are served from these assets: docs.ac/install redirects to
      # releases/latest/download/install.sh (and install.ps1), so the script a
      # user runs always comes from the newest release.
      - name: Attach the standalone compose file and the installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release upload "$TAG" \
            deployment/docker-compose-standalone.yaml \
            deployment/install.sh \
            deployment/install.ps1 \
            --clobber

      # The provenance covers the assets as GitHub serves them: download them
      # back, check they are the files this run uploaded, and hash those copies.
      # The generator records the run's commit as the source, so provenance is
      # only made when that is the tagged commit the assets came from. A manual
      # run for an older tag dispatched from main re-uploads identical files and
      # leaves that release's existing provenance in place.
      - name: Hash the published assets
        id: hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$GITHUB_SHA" ]; then
            echo "::notice::$TAG is at $checked_out, not this run's commit $GITHUB_SHA; skipping provenance."
            echo "attest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/published"
          gh release download "$TAG" --dir "$dir" \
            --pattern docker-compose-standalone.yaml \
            --pattern install.sh \
            --pattern install.ps1
          sums=$(cd "$dir" && sha256sum docker-compose-standalone.yaml install.sh install.ps1)
          (cd deployment && sha256sum --check --strict <<<"$sums")
          {
            echo "attest=true"
            echo "tag=$TAG"
            echo "hashes=$(base64 -w0 <<<"$sums")"
          } >> "$GITHUB_OUTPUT"

  # Signs SLSA provenance for the release assets with Sigstore and attaches it
  # to the release as docsgpt.intoto.jsonl (verify with slsa-verifier, see
  # SECURITY.md). The generator must be called by its release tag, not a SHA:
  # it checks its own ref, and slsa-verifier trusts it only at a tag.
  provenance:
    if: github.repository == 'arc53/DocsGPT' && needs.release-assets.outputs.attest == 'true'
    needs: release-assets
    permissions:
      actions: read # the generator reads this workflow run
      id-token: write # keyless signing with Sigstore
      contents: write # upload the provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] the generator only runs at a tag ref
    with:
      base64-subjects: ${{ needs.release-assets.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release-assets.outputs.tag }}
      provenance-name: docsgpt.intoto.jsonl
