name: Python linting

on:
  push:
    branches:
      - '*'
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint with Ruff
        uses: chartboost/ruff-action@e18ae971ccee1b2d7bbef113930f00c670b78da4 # v1.0.0
        with:
          version: 0.16.7

  requirements-in-sync:
    # docsgpt/requirements*.txt and tests/requirements.txt are exported from
    # uv.lock, and deployment/sandbox/requirements.lock is resolved from the
    # sandbox pins; fail when a change was not re-exported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Re-export and diff
        run: |
          uv lock --check
          bash scripts/export_requirements.sh
          git diff --exit-code -- docsgpt/requirements.txt docsgpt/requirements-docling.txt docsgpt/requirements-milvus.txt \
            docsgpt/requirements-decisions-torch.txt tests/requirements.txt deployment/sandbox/requirements.lock

      # deployment/sandbox/{requirements.txt,install-system.sh,sandbox.env,manifest.json}
      # are generated from docsgpt/sandbox/manifest.py (stdlib only, no install needed).
      - name: Sandbox image files match the manifest
        run: python3 scripts/export_sandbox_manifest.py --check
