name: OpenSSF Scorecard

# Publishes results to the public API, which scorecard.dev and the README badge read.
# The API only accepts results from a workflow without top-level env or write permissions,
# and a job that runs only approved actions (no run steps).
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"
  # Needed by the Branch-Protection check to see rule changes.
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    if: ${{ github.repository == 'arc53/DocsGPT' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Fine-grained PAT, DocsGPT only, Administration: read. The default token can't
          # read classic branch protection, so Branch-Protection errors without it.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
