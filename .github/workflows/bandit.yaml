name: Bandit Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  bandit_scan:
    if: ${{ github.repository == 'arc53/DocsGPT' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit  # Bandit is needed for this action
          if [ -f docsgpt/requirements.txt ]; then pip install -r docsgpt/requirements.txt; fi

      - name: Run Bandit scan
        # v1.0.1 hard-codes Python 3.8, which ubuntu-26.04 doesn't ship; main adds the python-version input.
        uses: PyCQA/bandit-action@7925d472505a4ec09ef471b22fe99c26fee47443 # main, 2026-10-27
        with:
          python-version: '3.12'
          severity: medium
          confidence: medium
          targets: docsgpt/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}