name: Bandit Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  bandit_scan:
    if: ${{ github.repository == 'arc53/DocsGPT' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action sets up its own Python and installs Bandit, which reads the
      # source without importing it, so the project's dependencies are not needed.
      - name: Run Bandit scan
        # v1.0.1 hard-codes Python 3.8, which ubuntu-26.04 doesn't ship; main adds the python-version input.
        uses: PyCQA/bandit-action@8970b6163696044b1b81bd86df0d01a7695e65df # main, 2026-10-27
        with:
          python-version: '3.12'
          severity: medium
          confidence: medium
          targets: docsgpt/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}