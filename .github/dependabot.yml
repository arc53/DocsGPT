# Dependabot version updates, weekly and grouped so one pull request carries each
# ecosystem's minor and patch bumps. Major bumps still come one per pull request.
# A release has to be a week old before Dependabot proposes it; security updates skip the wait.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Python dependencies are declared in pyproject.toml and locked in uv.lock, so the
# uv ecosystem updates those. Dependabot can't re-export docsgpt/requirements*.txt:
# .github/workflows/dependabot-uv-export.yml does that on its pull requests.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      frontend:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/extensions/react-widget"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      react-widget:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
