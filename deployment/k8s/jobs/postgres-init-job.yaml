# One-shot migrator: runs `python -m docsgpt.cli migrate --no-create` (Alembic
# upgrade to head on the database named by POSTGRES_URI), then exits. The
# postgres Deployment creates the database itself, hence --no-create. The API
# and worker pods do not migrate on start (AUTO_MIGRATE=false), so this Job
# must complete before they can serve.
#
# A finished Job is not re-run by `kubectl apply`. After changing the image tag
# on an upgrade, delete it and apply again, then wait for it before rolling the
# Deployments:
#   kubectl delete job postgres-init --ignore-not-found
#   kubectl apply -k deployment/k8s/
#   kubectl wait --for=condition=complete job/postgres-init --timeout=300s
# Migrating is idempotent: an up-to-date database is left as it is.
#
# While docsgpt-secrets is not filled in, check-secrets fails and the Job
# retries until backoffLimit, then stops for good. After fixing the secret,
# delete the Job and apply again as above.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      # Refuse to start while docsgpt-secrets is not filled in.
      - name: check-secrets
        image: arc53/docsgpt:0.21.0
        envFrom:
        - secretRef:
            name: docsgpt-secrets
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        command:
          - sh
          - -c
          - |
            problems=""
            fail() { problems="$problems
              - $1"; }
            for key in $(env | sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*REPLACE_ME.*/\1/p' | sort -u); do
              fail "$key still contains REPLACE_ME"
            done
            for key in INTERNAL_KEY JWT_SECRET_KEY ENCRYPTION_SECRET_KEY POSTGRES_URI; do
              eval "value=\${$key:-}"
              [ -n "$value" ] || fail "$key is empty or missing"
            done
            storage=$(printf '%s' "${STORAGE_TYPE:-local}" | tr '[:upper:]' '[:lower:]')
            if [ "$storage" = "s3" ] && [ -z "${S3_BUCKET_NAME:-}" ]; then
              fail "S3_BUCKET_NAME is empty or missing while STORAGE_TYPE is s3"
            fi
            case "${POSTGRES_URI:-}" in
              *@postgres:*|*@postgres/*)
                case "$POSTGRES_URI" in
                  *":${POSTGRES_PASSWORD:-}@postgres"[:/]*) ;;
                  *) fail "the password in POSTGRES_URI does not match POSTGRES_PASSWORD" ;;
                esac ;;
            esac
            if [ -n "$problems" ]; then
              echo "docsgpt-secrets is not filled in:$problems" >&2
              echo "Fix deployment/k8s/docsgpt-secrets.yaml and apply it (see the Kubernetes guide)." >&2
              exit 1
            fi
      - name: wait-for-postgres
        image: pgvector/pgvector:0.8.6-pg16
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        command:
          - sh
          - -c
          - |
            until pg_isready -h postgres -p 5432 -U docsgpt -d docsgpt; do
              echo "Waiting for postgres..."; sleep 2;
            done
      containers:
      - name: postgres-init
        image: arc53/docsgpt:0.21.0
        # The `docsgpt migrate` command. The image has no `docsgpt` console script,
        # and images up to 0.21.0 have no `python -m docsgpt`, so run the module.
        command: ["python", "-m", "docsgpt.cli", "migrate", "--no-create"]
        envFrom:
        - secretRef:
            name: docsgpt-secrets
        resources:
          limits:
            memory: "1Gi"
            cpu: "1"
          requests:
            memory: "256Mi"
            cpu: "100m"
