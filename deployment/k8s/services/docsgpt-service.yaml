# Cluster-internal only. For a first look, use
#   kubectl port-forward service/docsgpt-api-service 7091:80
# and open http://localhost:7091. To publish DocsGPT, put it behind an Ingress
# with TLS (see ingress-example.yaml) and set AUTH_TYPE in docsgpt-secrets.
apiVersion: v1
kind: Service
metadata:
  name: docsgpt-api-service
spec:
  selector:
    app: docsgpt-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 7091
  type: ClusterIP
