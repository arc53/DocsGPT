# Settings shared by the API, the worker and the migration Job.
#
# Values are plain text (stringData); Kubernetes stores them base64-encoded.
# Keep your filled-in copy out of version control.
#
# Replace every REPLACE_ME value before `kubectl apply -k deployment/k8s/`.
# A `check-secrets` init container in each DocsGPT pod refuses to start while
# any value still contains REPLACE_ME, and its log names the keys to fix:
#   kubectl logs job/postgres-init -c check-secrets
#
# Generate each key with: openssl rand -hex 32
# and the Postgres password with: openssl rand -hex 24
# Every API and worker replica must see the same values, and changing
# ENCRYPTION_SECRET_KEY later makes stored tool and connector credentials
# unreadable (see ENCRYPTION_SECRET_KEY_PREVIOUS in the settings reference).
apiVersion: v1
kind: Secret
metadata:
  name: docsgpt-secrets
type: Opaque
stringData:
  # --- Keys (required) ---
  # Worker-to-API shared secret. Anyone holding it can call the internal
  # endpoints that read and write every user's files and indexes.
  INTERNAL_KEY: REPLACE_ME
  # Signs session tokens and capability URLs.
  JWT_SECRET_KEY: REPLACE_ME
  # Encrypts stored tool and connector credentials.
  ENCRYPTION_SECRET_KEY: REPLACE_ME

  # --- Authentication ---
  # Unset means no login: anyone who can reach the API is the same local user.
  # Set it before exposing DocsGPT outside the cluster. oidc gives separate
  # accounts (also set OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_FRONTEND_URL);
  # simple_jwt is one shared token printed in the API log.
  # AUTH_TYPE: oidc
  # Public address of DocsGPT, without a trailing slash. The API builds agent
  # image, agent webhook, device pairing and MCP OAuth callback URLs from it.
  # Left unset it is http://localhost:7091, which only works through
  # `kubectl port-forward ... 7091:80`. (The worker keeps its own in-cluster
  # API_URL from docsgpt-deploy.yaml.)
  # API_URL: https://docsgpt.example.com

  # --- File storage (required) ---
  # Uploads land on the API pod and are parsed on the worker pod, so both must
  # see the same files. The default is an S3-compatible bucket you create.
  # For a ReadWriteMany volume instead, see the Kubernetes guide.
  STORAGE_TYPE: s3
  S3_BUCKET_NAME: REPLACE_ME
  S3_ACCESS_KEY_ID: REPLACE_ME
  S3_SECRET_ACCESS_KEY: REPLACE_ME
  # AWS region of the bucket ("auto" for Cloudflare R2).
  # S3_REGION: us-east-1
  # Non-AWS services (MinIO, R2, B2, Spaces): the endpoint, usually with path-style.
  # S3_ENDPOINT_URL: https://minio.example.com
  # S3_PATH_STYLE: "true"
  # Delete both S3_* key lines above to use the pod's cloud identity (IRSA,
  # Workload Identity) instead of static keys.

  # --- Vector store ---
  # pgvector in the bundled Postgres (the postgres Deployment runs the pgvector
  # image). To use a separate database, set PGVECTOR_CONNECTION_STRING.
  VECTOR_STORE: pgvector

  # --- Model provider ---
  # "docsgpt" sends every chat to the hosted DocsGPT API. To use your own
  # provider, set LLM_PROVIDER (openai, anthropic, google, groq, ...), its key
  # in API_KEY and the model in LLM_NAME.
  LLM_PROVIDER: docsgpt
  # API_KEY: REPLACE_ME
  # LLM_NAME: gpt-5.5

  # --- In-cluster services ---
  CELERY_BROKER_URL: redis://redis-service:6379/0
  CELERY_RESULT_BACKEND: redis://redis-service:6379/1
  # LLM cache, live events, SSO state, device pairing and session store.
  CACHE_REDIS_URL: redis://redis-service:6379/2
  # --- Postgres (required) ---
  # Password of the bundled Postgres. It sets the password only when the
  # postgres Deployment first initializes its volume; changing it later needs
  # ALTER USER as well. Use URL-safe characters (the hex from openssl is).
  POSTGRES_PASSWORD: REPLACE_ME
  # Put the same password in place of REPLACE_ME here. check-secrets refuses a
  # mismatch while the host is the bundled `postgres`. For an external
  # database, point this at it instead (and drop the postgres manifests from
  # kustomization.yaml if you don't need them).
  POSTGRES_URI: postgresql://docsgpt:REPLACE_ME@postgres:5432/docsgpt
