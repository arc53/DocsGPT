# Builds the images from this checkout. The API (7091) and UI (5173) are published
# on DOCSGPT_BIND (default 127.0.0.1, this machine only; 0.0.0.0 for every
# interface, after setting AUTH_TYPE), Postgres and Redis on 127.0.0.1 only. Run it
# with --env-file .env from the repository root so DOCSGPT_BIND is read.
# The decision model runs in the backend, which the worker calls, and loads
# nothing until a decision feature is turned on. To serve it from the decider
# container instead, add three lines to .env:
#   COMPOSE_PROFILES=decider
#   DECISION_BASE_URL=http://decider:7095
#   DECISION_KEY=<a long random string, e.g. from openssl rand -hex 32>
# The decider refuses to start without DECISION_KEY, and the backend does not
# wait for it (decisions fail open).
name: docsgpt-oss
services:
  frontend:
    build:
      context: ../frontend
      # Vite dev server with hot reload over the bind mount below. The default
      # target (what Docker Hub publishes) is a static build behind nginx.
      target: dev
    volumes:
      - ../frontend/src:/app/src
    environment:
      # Every VITE_* the app reads. A bare name is passed through only when it is
      # set in the shell or the --env-file, so an unset one does not reach the
      # container as an empty string and override the image's own default.
      - VITE_API_HOST=http://localhost:7091
      - VITE_API_STREAMING=${VITE_API_STREAMING:-true}
      - VITE_BASE_URL
      - VITE_GOOGLE_CLIENT_ID
      - VITE_GOOGLE_PICKER_API_KEY
      - VITE_NOTIFICATION_TEXT
      - VITE_NOTIFICATION_LINK
      - VITE_ENABLE_VOICE_INPUT
      - VITE_DISABLE_SOURCE_FE
      - VITE_USE_V
    ports:
      - "${DOCSGPT_BIND:-127.0.0.1}:5173:5173"
    depends_on:
      - backend

  backend:
    user: root
    build:
      context: ..
      dockerfile: docsgpt/Dockerfile
      args:
        # Optional extras to bake in (comma-separated): docling, milvus. The
        # docling extra brings the layout-model parser/OCR backend and its
        # models. INSTALL_DOCLING=true is the older spelling of EXTRAS=docling.
        EXTRAS: ${EXTRAS:-}
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
        # Bake the tesseract binary behind OCR_ENABLED=true (~35 MB): set
        # INSTALL_TESSERACT=true in ../.env (read with --env-file .env) or the
        # shell (setup.sh does this when OCR is enabled). Off by default, like
        # docling. Upgrading a deployment that already runs OCR_ENABLED=true
        # with tesseract: add INSTALL_TESSERACT=true to ../.env before
        # rebuilding, or scanned pages fail with an install hint.
        INSTALL_TESSERACT: ${INSTALL_TESSERACT:-false}
    env_file:
      - ../.env
    environment:
      # Override URLs to use docker service names
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CACHE_REDIS_URL=redis://redis:6379/2
      - POSTGRES_URI=postgresql://docsgpt:docsgpt@postgres:5432/docsgpt
    ports:
      - "${DOCSGPT_BIND:-127.0.0.1}:7091:7091"
    volumes:
      # Host data stays under application/ (the old package directory) for this
      # release so an upgraded checkout keeps its indexes; it moves with the
      # packaging work, together with an upgrade note.
      - ../application/indexes:/app/indexes
      - ../application/inputs:/app/inputs
      - ../application/vectors:/app/vectors
      - decision_models:/app/models/decision
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    user: root
    build:
      context: ..
      dockerfile: docsgpt/Dockerfile
      args:
        EXTRAS: ${EXTRAS:-}
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
        INSTALL_TESSERACT: ${INSTALL_TESSERACT:-false}
    # Consumes the default queue AND the dedicated `parsing` (read_document /
    # parse_document) and `embeddings` (query embedding) queues. Without `parsing`
    # the read_document await never resolves; without `embeddings` every search
    # fails after EMBEDDINGS_DELEGATE_TIMEOUT, because EMBEDDINGS_DELEGATE_TO_WORKER
    # is on by default. `analytics` carries the conversation-analytics sweep (idle
    # unless DECISION_ANALYTICS_ENABLED); on a 1-CPU host, see "The analytics queue"
    # in docs/content/Deploying/Background-Jobs.mdx first. For heavy/OCR parsing run a separate
    # worker with `-Q parsing`; to keep query latency off the ingest pool, another
    # with `-Q embeddings`.
    command: celery -A docsgpt.app.celery worker -l INFO -B -Q docsgpt,parsing,embeddings,analytics
    env_file:
      - ../.env
    environment:
      # Override URLs to use docker service names
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - API_URL=http://backend:7091
      - CACHE_REDIS_URL=redis://redis:6379/2
      - POSTGRES_URI=postgresql://docsgpt:docsgpt@postgres:5432/docsgpt
    volumes:
      # Host data stays under application/ (the old package directory) for this
      # release so an upgraded checkout keeps its indexes; it moves with the
      # packaging work, together with an upgrade note.
      - ../application/indexes:/app/indexes
      - ../application/inputs:/app/inputs
      - ../application/vectors:/app/vectors
      - decision_models:/app/models/decision
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  # The decision model (docsgpt decide-server), on the CPU, idle until a
  # decision feature is turned on. Only with the decider profile (see the top).
  decider:
    profiles: [decider]
    user: root
    build:
      context: ..
      dockerfile: docsgpt/Dockerfile
      args:
        EXTRAS: ${EXTRAS:-}
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
        INSTALL_TESSERACT: ${INSTALL_TESSERACT:-false}
    command: python -m docsgpt decide-server --host 0.0.0.0 --port 7095 --device cpu
    env_file:
      - ../.env
    volumes:
      - decision_models:/app/models/decision
    mem_limit: ${DECISION_MEMORY:-2g}

  redis:
    image: redis:6-alpine
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=docsgpt
      - POSTGRES_PASSWORD=docsgpt
      - POSTGRES_DB=docsgpt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsgpt -d docsgpt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  decision_models:
