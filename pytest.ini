[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --ignore=tests/integration
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    fresh_db: Give the test a database of its own instead of the worker's shared one (for tests that commit)
asyncio_mode = strict
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
