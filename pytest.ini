[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --ignore=tests/integration
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
asyncio_mode = strict
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
